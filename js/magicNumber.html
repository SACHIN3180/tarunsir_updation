<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .main{
            width: 600px;
            height: 300px;
            margin: 100px auto;
             display: flex;
            flex-wrap: wrap;
        }
        .box {
            width: 200px;
            height: 100px;
            background-color: gray;
            border: 1px solid black;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
    </div>
</body>
<script src="magicNumber.js"></script>

</html>
