<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 400px;
            height: 400px;
            background-color: brown;
            margin: 200px;
            align-items: center;
        }

        .box:hover {
            /* transform: scale(1.2); */
            transform: scale(1.2);
            transform-origin: bottom center;
        }

        .rotareImg {
            position: relative;
            width: 400px;
            /* align-items: center;
            margin: auto; */
        }

        .rotate {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background-color: darkkhaki;
            /* margin: 200px; */
            transition: 2s;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 2s;
            z-index: 2;

        }

        .rotate:hover {
            transform: translate(-50%, -50%) rotate(1turn);
            transform-origin: center center;
        }

        .rotate1 {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 2s;
            z-index: 3;
        }

        .rotate1:hover {
            transform: translate(-50%, -50%) rotateX(360deg);
        }

        .rotate2 {
            width: 600px;
            height: 600px;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 2s;
            z-index: 0;
        }

        .rotate2:hover {
            transform: translate(-50%, -50%) rotateY(360deg);
        }

        .twoSideImg {
            width: 100%;
            margin: 200px;
            text-align: center;
        }

        .flipDiv {
            width: 1240px;
            display: flex;
            position: relative;
        }

        .divFlower {
            width: 1240px;
            /* position: relative; */
        }

        .divFlower img {
            width: 300px;
            height: 400px;

        }

        .divButterfly {
            position: absolute;
            top: 0;
            left: 470px;
            opacity: 0;
            transition: 2s;
        }

        .flipDiv:hover .divButterfly {
            opacity: 1;
        }

        .divButterfly img {
            width: 300px;
            height: 400px;
        }

        .rotateSection {
            width: 100%;
            text-align: center;
        }

        .mainDivRotate {
            width: 1240px;
            position: relative;
        }

        .divGorilla img {
            width: 400px;
            height: 500px;
            transform: rotateY(270degre);
        }

        .divGorilla,
        .divBear {
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 1s;
            backface-visibility: hidden;
        }

        .divBear img {
            width: 400px;
            height: 500px;
            left: 420px;
        }


        .divBear {
            transform: rotateY(180deg);
        }

        .mainDivRotate:hover .divGorilla {
            transform: rotateY(180deg);
        }

        .mainDivRotate:hover .divBear {
            transform: rotateY(0deg);
        }
    </style>
</head>

<body>

    <div>
        <div class="box">

        </div>
    </div>

    <div class="rotareImg">
        <img class="rotate" src="https://wallpaperaccess.com/full/5481163.jpg" alt="">
        <img class="rotate1" src="https://tse4.mm.bing.net/th/id/OIP.Cy1BNZjTX3gwIlC1zQEFpQHaEK?r=0&pid=Api&h=220&P=0"
            alt="">
        <img class="rotate2" src="https://wallpaperaccess.com/full/1996311.jpg" alt="">

    </div>

    <section class="twoSideImg">
        <div class="flipDiv">
            <div class="divFlower">
                <img src="https://img.magnific.com/free-photo/pink-gerbera-flower-garden_1373-15.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="">
            </div>
            <div class="divButterfly">
                <img src="https://cdn.pixabay.com/photo/2023/04/25/03/02/butterfly-7949342_1280.jpg" alt="">
            </div>

        </div>
    </section>

    <section class="rotateSection">
        <div class="mainDivRotate">
            <div class="divGorilla">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvCbvNMduhLhElEZUInac8EaPo5GtvthCb_GlVvZ7l69Ydb5-KlYeHM11VaahKLXx2M1rAloIDS-HCTnVbuBqdNni_LRpRYXKNcacV7A&s=10"
                    alt="">
            </div>
            <div class="divBear">
                <img src="https://i.guim.co.uk/img/media/11d4c182d094199e26ddb36febe67123a9bbc93a/34_246_2966_4275/master/2966.jpg?width=445&dpr=1&s=none&crop=none"
                    alt="">
            </div>
        </div>
    </section>



</body>
<script></script>

</html>
